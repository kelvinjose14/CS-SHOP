name: Instalador Windows

# En cada pull request:
#  - Linux: pruebas de lógica, de interfaz y de rendimiento (3 años de datos).
#  - Windows: las mismas pruebas, el instalador, y el programa instalado de verdad
#    (instalar, usar, reinstalar encima y desinstalar sin perder los datos).
# Al crear una etiqueta vX.Y.Z, el instalador se publica en Releases.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bibliotecas para Electron
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64

      - run: npm ci

      - name: Pruebas de lógica, migración, respaldos y red
        run: npm test

      - name: Pruebas de interfaz
        run: xvfb-run -a npm run test:ui

      - name: Rendimiento con 3 años de datos
        run: npm run test:perf

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Con una etiqueta, primero se comprueba que coincida con package.json y que el CHANGELOG
      # tenga las notas de esa versión; si no, no se construye nada.
      - name: Notas de la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/notas-version.js "${{ github.ref_name }}" notas-version.md

      - name: Pruebas
        run: npm test

      - name: Pruebas de interfaz
        run: npm run test:ui

      # Firma: si el repositorio tiene los secretos WIN_CSC_LINK (certificado .pfx en base64) y
      # WIN_CSC_KEY_PASSWORD, el instalador sale firmado; si no, sale sin firmar (DT-18).
      - name: Construir instalador
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: CAPS-Shop-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Instalar, usar, reinstalar y desinstalar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\CAPS-Shop-Setup-*.exe).FullName
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\CAPS Shop'
          $env:CAPSSHOP_EXE = Join-Path $dir 'CAPS Shop.exe'
          $env:CAPSSHOP_KEEP_DATA = Join-Path $env:APPDATA 'CAPS Shop\data'

          Write-Host '1. Instalación silenciosa'
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          if (-not (Test-Path $env:CAPSSHOP_EXE)) { throw "No se instaló $env:CAPSSHOP_EXE" }
          node --test test/ui/installed.test.js
          if ($LASTEXITCODE) { throw 'Falló el programa instalado' }

          Write-Host '2. Reinstalar encima: los datos siguen'
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          node --test test/ui/installed.test.js
          if ($LASTEXITCODE) { throw 'Falló después de reinstalar' }

          Write-Host '3. Desinstalar: el programa se va y los datos quedan'
          Start-Process -Wait -FilePath (Join-Path $dir 'Uninstall CAPS Shop.exe') -ArgumentList '/S'
          for ($i = 0; $i -lt 60 -and (Test-Path $env:CAPSSHOP_EXE); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $env:CAPSSHOP_EXE) { throw 'No se desinstaló' }
          if (-not (Test-Path (Join-Path $env:CAPSSHOP_KEEP_DATA 'capsshop.db'))) { throw 'La desinstalación borró los datos' }
          Write-Host 'Instalación probada.'

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CAPS Shop ${{ github.ref_name }}
          body_path: notas-version.md
          # latest.yml y el .blockmap son los que usan las PCs instaladas para saber que hay versión nueva.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
