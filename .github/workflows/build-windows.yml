name: Instalador Windows

# Genera "CAPS-Shop-Setup-<versión>.exe".
# - Manual: pestaña Actions → "Instalador Windows" → Run workflow.
# - Automático: al crear una etiqueta vX.Y.Z se publica en Releases.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas
        run: npm test

      - name: Construir instalador
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: CAPS-Shop-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
